name: water-flows

on:
  push:
    paths: ["flows/**", "skala/**", ".github/workflows/water-flows.yml"]
  pull_request:
    paths: ["flows/**", "skala/**", ".github/workflows/water-flows.yml"]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache Hugging Face checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-skala-${{ hashFiles('skala/src/skala/functional/_hashes.py') }}
      - name: Install (CPU)
        run: bash flows/setup_env.sh
      - name: Lint
        run: uvx ruff check flows
      - name: Water opt -> freq -> thermo smoke test
        run: .venv/bin/python -m pytest flows/tests -v -p no:cacheprovider
